[package]
name = "aimlabs"
version = "0.1.0"
edition = "2021"
description = "AimLabs AimBridge SDK (shared-memory protocol v2): zero-copy frames, state, move/fire/mark commands"
license = "MIT"

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "aimlabs-selftest"
path = "src/bin/selftest.rs"
