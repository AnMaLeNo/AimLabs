[project]
name = "aimlabs"
version = "0.1.0"
description = "Client SDK for the AimLabs AimBridge shared-memory interface"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aimlabs*"]
