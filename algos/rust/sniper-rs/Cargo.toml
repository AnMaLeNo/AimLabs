[package]
name = "sniper-rs"
version = "0.1.0"
edition = "2021"
description = "AimLabs « une balle » trigger in Rust: zero-copy crop from the AimBridge segment, YOLO11-seg via ONNX Runtime (CUDA/TensorRT EP), edge-velocity lead, fire only when sure"

[dependencies]
aimlabs = { path = "../../../sdk/rust/aimlabs" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"

[features]
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]

[profile.release]
opt-level = 3
lto = "thin"
